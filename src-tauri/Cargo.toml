[package]
name = "administrativo"
version = "0.1.1"
description = "Administrativo — remisiones y catálogo en lista"
authors = ["you"]
edition = "2021"

[lib]
# El sufijo `_lib` evita un conflicto de nombres con el bin en Windows
# (ver https://github.com/rust-lang/cargo/issues/8519).
name = "administrativo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
bcrypt = "0.15"
